<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radiometric Quantities Explorer</title>
<style>
body{font-family:Arial,sans-serif;margin:0;color:#10203f;background:#fff}.wrap{max-width:1150px;margin:auto;padding:24px}h1{margin:0 0 6px}.sub{color:#66758c;margin-bottom:18px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tab{padding:8px 11px;border:1px solid #cfd8e6;border-radius:20px;background:white;font-weight:bold;cursor:pointer}.tab.active{background:#10203f;color:white}.card{border:1px solid #dbe3ef;border-radius:14px;padding:15px}canvas{width:100%;height:auto;border:1px solid #dbe3ef;border-radius:12px}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.box{background:#f8fbff;padding:11px;border-radius:9px}.k{font-size:11px;color:#66758c;text-transform:uppercase}.v{font-weight:bold;margin-top:4px}.note{margin-top:10px;padding:10px;border-left:4px solid #d69e2e;background:#fffaf0}@media(max-width:700px){.info{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>Radiometric Quantities Explorer</h1><div class="sub">The same optical energy is described differently depending on the engineering question. Select a quantity to highlight where it belongs in a machine-vision chain.</div>
<div class="tabs">
<button class="tab active" data-q="flux">Radiant flux Φe</button><button class="tab" data-q="intensity">Radiant intensity Ie</button><button class="tab" data-q="irradiance">Irradiance Ee</button><button class="tab" data-q="exitance">Radiant exitance Me</button><button class="tab" data-q="radiance">Radiance Le</button><button class="tab" data-q="exposure">Radiant exposure He</button>
</div><div class="card"><canvas id="cv" width="1020" height="540"></canvas><div class="info"><div class="box"><div class="k">Engineering question</div><div class="v" id="question"></div></div><div class="box"><div class="k">Definition and units</div><div class="v" id="definition"></div></div></div><div class="note" id="note"></div></div></div>
<script>
(function(){
const cv=document.getElementById('cv'),c=cv.getContext('2d'),tabs=[...document.querySelectorAll('.tab')],question=document.getElementById('question'),definition=document.getElementById('definition'),note=document.getElementById('note');let active='flux';
const D={
flux:['How much optical power is being transported in total?','Φe = dQe/dt   [W]','Radiant flux is total optical power. It does not yet say where that power travels or over what area it is distributed.'],
intensity:['How much source power is travelling into a particular direction?','Ie = dΦe/dΩ   [W sr⁻¹]','Radiant intensity adds direction. The highlighted cone represents the solid angle dΩ: a bundle of directions leaving the source.'],
irradiance:['How much optical power arrives on each unit area of the workpiece?','Ee = dΦe/dA   [W m⁻²]','Irradiance is arriving power per area. The same power concentrated onto a smaller area produces greater irradiance.'],
exitance:['How much optical power leaves each unit area of the surface?','Me = dΦe/dA   [W m⁻²]','Radiant exitance has the same units as irradiance, but the direction is reversed: irradiance arrives; exitance leaves.'],
radiance:['How much power leaves a projected surface area in the directions accepted by the camera?','Le = d²Φe / (dA cosθ dΩ)   [W m⁻² sr⁻¹]','Radiance combines area and direction. A camera collects only the portion of the outgoing radiation travelling towards its entrance pupil.'],
exposure:['How much optical energy accumulates per unit sensor area during the exposure?','He = ∫Ee(t)dt   [J m⁻²]; constant Ee: He = Ee texp','Radiant exposure integrates sensor irradiance over time. At fixed wavelength, more irradiance or longer exposure means more arriving photons.']
};
function txt(s,x,y,z=15,col='#10203f',w='normal'){c.fillStyle=col;c.font=w+' '+z+'px Arial';c.fillText(s,x,y)}
function ln(x1,y1,x2,y2,col='#334155',w=2){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function ar(x1,y1,x2,y2,col,w=2){ln(x1,y1,x2,y2,col,w);let a=Math.atan2(y2-y1,x2-x1),s=9;c.fillStyle=col;c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-s*Math.cos(a-.5),y2-s*Math.sin(a-.5));c.lineTo(x2-s*Math.cos(a+.5),y2-s*Math.sin(a+.5));c.closePath();c.fill()}
function alpha(on){return on?1:.14}
function draw(){
c.clearRect(0,0,cv.width,cv.height);txt('SOURCE',70,50,15,'#334155','bold');txt('WORKPIECE',420,50,15,'#334155','bold');txt('CAMERA / SENSOR',790,50,15,'#334155','bold');
c.globalAlpha=alpha(active==='flux'||active==='intensity');c.fillStyle='#f5b942';c.beginPath();c.arc(115,220,32,0,Math.PI*2);c.fill();for(let a=-1.1;a<=1.1;a+=.28)ar(115,220,115+115*Math.cos(a),220+115*Math.sin(a),'#d69e2e',1.2);c.globalAlpha=1;
c.globalAlpha=alpha(['irradiance','exitance','radiance'].includes(active));c.fillStyle='#dbe5ef';c.fillRect(430,165,170,125);c.strokeStyle='#64748b';c.strokeRect(430,165,170,125);txt('surface dA',470,315,14,'#475569');c.globalAlpha=1;
c.globalAlpha=alpha(active==='radiance'||active==='exposure');c.fillStyle='#d7e5ff';c.fillRect(810,175,120,90);c.strokeStyle='#315b9b';c.strokeRect(810,175,120,90);c.fillStyle='#334155';c.beginPath();c.arc(810,220,24,0,Math.PI*2);c.fill();c.fillStyle='#eef2f7';c.fillRect(875,193,22,54);c.strokeStyle='#64748b';c.strokeRect(875,193,22,54);txt('lens',786,282,13,'#475569');txt('sensor',865,282,13,'#475569');c.globalAlpha=1;
c.globalAlpha=.15;ar(150,220,430,215,'#e07a28',3);ar(600,210,785,220,'#e07a28',3);c.globalAlpha=1;
if(active==='flux'){c.strokeStyle='#e07a28';c.lineWidth=5;c.beginPath();c.arc(115,220,70,-.75,.75);c.stroke();txt('Φe',170,160,28,'#e07a28','bold');txt('total optical power',170,188,14,'#475569')}
if(active==='intensity'){c.fillStyle='rgba(224,122,40,.16)';c.beginPath();c.moveTo(115,220);c.lineTo(360,160);c.lineTo(360,280);c.closePath();c.fill();ln(115,220,360,160,'#e07a28',3);ln(115,220,360,280,'#e07a28',3);txt('dΩ',245,212,24,'#e07a28','bold');txt('Ie = power per solid angle',185,330,15,'#475569')}
if(active==='irradiance'){for(let y=180;y<=270;y+=22)ar(300,y,430,y,'#2166f3',3);c.fillStyle='rgba(33,102,243,.15)';c.fillRect(430,180,18,90);txt('Ee',350,150,28,'#2166f3','bold');txt('arriving power / area',300,340,15,'#475569')}
if(active==='exitance'){for(let a=-1.1;a<=-0.1;a+=.2)ar(515,165,515+125*Math.cos(a),165+125*Math.sin(a),'#2f855a',2.5);txt('Me',535,115,28,'#2f855a','bold');txt('leaving power / area',445,355,15,'#475569')}
if(active==='radiance'){c.fillStyle='rgba(224,122,40,.14)';c.beginPath();c.moveTo(570,200);c.lineTo(785,192);c.lineTo(785,248);c.closePath();c.fill();ln(570,200,785,192,'#e07a28',3);ln(570,200,785,248,'#e07a28',3);ar(575,210,785,220,'#e07a28',4);txt('Le',650,165,28,'#e07a28','bold');ln(570,200,570,125,'#64748b',1.5);txt('normal',578,130,12,'#64748b');txt('θ',590,185,18,'#64748b','bold');txt('area + direction to camera',585,325,15,'#475569')}
if(active==='exposure'){ar(780,220,865,220,'#2166f3',4);txt('Ee',795,192,22,'#2166f3','bold');for(let i=0;i<28;i++){let x=879+(i%4)*5,y=200+Math.floor(i/4)*7;c.fillStyle='rgba(33,102,243,'+(0.3+.02*i)+')';c.beginPath();c.arc(x,y,2.3,0,Math.PI*2);c.fill()}txt('He',905,155,28,'#2f855a','bold');ar(755,385,940,385,'#334155',2);txt('exposure time',805,415,15,'#475569');txt('accumulated energy',795,450,15,'#2f855a','bold')}
c.globalAlpha=alpha(active==='intensity'||active==='radiance');txt('Solid angle dΩ',65,420,14,'#334155','bold');c.strokeStyle='#64748b';c.beginPath();c.arc(125,480,46,Math.PI*1.1,Math.PI*1.9);c.stroke();c.fillStyle='rgba(224,122,40,.18)';c.beginPath();c.moveTo(125,480);c.lineTo(92,445);c.lineTo(158,445);c.closePath();c.fill();ln(125,480,92,445,'#e07a28',2);ln(125,480,158,445,'#e07a28',2);txt('cone of directions',175,478,13,'#475569');c.globalAlpha=1;
}
function sel(q){active=q;tabs.forEach(b=>b.classList.toggle('active',b.dataset.q===q));question.textContent=D[q][0];definition.textContent=D[q][1];note.innerHTML='<b>'+D[q][2].split('.')[0]+'.</b>'+D[q][2].substring(D[q][2].indexOf('.')+1);draw()}
tabs.forEach(b=>b.onclick=()=>sel(b.dataset.q));sel('flux');
})();
</script></body></html>
